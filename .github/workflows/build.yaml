name: "Reusable Build"
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      docker_context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
    secrets:
      READER_TOKEN:
        description: "PAT (classic) med read:packages for GitHub Packages"
        required: true
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        description: "Brukes av docker-build-push, kun på main"
        required: false
    outputs:
      image:
        description: "Image tag that will be pushed"
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: "Build and test"
    runs-on: "ubuntu-24.04"
    permissions:
      contents: "read"
      id-token: "write"
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6" # v6.4.0
      - uses: "actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad" # v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: "gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6" # v6.4.0
      - name: "Compile and run tests"
        env:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
          SERVICE_NAME: ${{ inputs.service_name }}
        run: './gradlew "${SERVICE_NAME}:test" "${SERVICE_NAME}:installDist"'
      - uses: "nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1" # v0
        if: github.ref == 'refs/heads/main'
        id: docker-build-push
        with:
          docker_context: ${{ inputs.docker_context }}
          dockerfile: ${{ inputs.dockerfile }}
          image_suffix: ${{ inputs.service_name }}
          team: "utenlandsadresser"
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
