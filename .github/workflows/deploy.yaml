name: "Reusable Deploy"
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      cluster:
        required: true
        type: string
      gh_environment:
        required: true
        type: string
      nais_resource_file:
        required: true
        type: string
      nais_vars_file:
        required: true
        type: string

jobs:
  deploy:
    name: "Deploy to ${{ inputs.cluster }}"
    if: github.ref == 'refs/heads/main'
    runs-on: "ubuntu-24.04"
    permissions:
      contents: "read"
      id-token: "write"
    environment: "${{ inputs.gh_environment }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Deploy to ${{ inputs.cluster }}"
        uses: "nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50" # v3
        env:
          CLUSTER: "${{ inputs.cluster }}"
          RESOURCE: "${{ inputs.nais_resource_file }}"
          VAR: "image=${{ inputs.image }}"
          VARS: "${{ inputs.nais_vars_file }}"