name: "Reusable Deploy"
on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      cluster:
        required: true
        type: string
      gh_environment:
        required: true
        type: string
      nais_resource_file:
        required: true
        type: string
      nais_vars_file:
        required: true
        type: string

jobs:
  deploy:
    name: "Deploy to ${{ inputs.cluster }}"
    if: github.ref == 'refs/heads/main'
    # Én deploy om gangen per pipeline og cluster. En deploy som kjører eller venter på
    # godkjenning avbrytes aldri. Bare den nyeste ventende beholdes, eldre ventende avbrytes.
    # github.workflow er navnet på pipelinen som kaller denne workflowen.
    concurrency:
      group: deploy-${{ github.workflow }}-${{ inputs.cluster }}
      cancel-in-progress: false
    runs-on: "ubuntu-24.04"
    permissions:
      id-token: "write"
    environment: "${{ inputs.gh_environment }}"
    steps:
      - uses: "actions/checkout@v7"
      - name: "Deploy to ${{ inputs.cluster }}"
        uses: "nais/deploy/actions/deploy@v3"
        env:
          CLUSTER: "${{ inputs.cluster }}"
          RESOURCE: "${{ inputs.nais_resource_file }}"
          VAR: "image=${{ inputs.image }}"
          VARS: "${{ inputs.nais_vars_file }}"