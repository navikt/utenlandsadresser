name: "Deploy Alerts"
on:
  workflow_dispatch: {}
  push:
    branches:
      - "main"
    paths:
      - 'app/.nais/alerts.yaml'
      - '.github/workflows/alerts.yaml'
permissions: {}

jobs:
  deployAlertsToDev:
    name: "Deploy alerts to dev"
    runs-on: "ubuntu-24.04"
    environment: "dev-gcp"
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Deploy alerts to DEV"
        uses: "nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50" # v3
        env:
          "CLUSTER": "dev-gcp"
          "RESOURCE": "app/.nais/alerts.yaml"
          "VARS": "app/.nais/vars/dev.yaml"

  deployAlertsToProd:
    name: "Deploy alerts to prod"
    environment: "prod-gcp"
    runs-on: "ubuntu-24.04"
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Deploy alerts to PROD"
        uses: "nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50" # v3
        env:
          "CLUSTER": "prod-gcp"
          "RESOURCE": "app/.nais/alerts.yaml"
          "VARS": "app/.nais/vars/prod.yaml"
