name: "CI/CD Pipeline for app"
on:
  workflow_dispatch: {}
  push:
    paths-ignore:
      - "**.md"
      - "app/.nais/alerts.yaml"
      - ".github/workflows/alerts.yaml"
      - "sporingslogg-cleanup/**"
      - "hent-utenlandsadresser/**"

permissions: {}

jobs:
  build:
    uses: $/.github/workflows/build.yaml
    permissions:
      contents: read
      id-token: write
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    with:
      service_name: "app"
      docker_context: "./app"
      dockerfile: "./app/Dockerfile"

  deploy:
    uses: $/.github/workflows/deploy.yaml
    needs: build
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        env:
          - cluster: "dev-gcp"
            gh_environment: "dev-gcp"
            nais_vars_file: "dev"
          - cluster: "prod-gcp"
            gh_environment: "prod-gcp"
            nais_vars_file: "prod"
    with:
      image: ${{ needs.build.outputs.image }}
      cluster: ${{ matrix.env.cluster }}
      gh_environment: ${{ matrix.env.gh_environment }}
      nais_resource_file: "app/.nais/unleash-apitoken.yaml,app/.nais/nais.yaml"
      nais_vars_file: "app/.nais/vars/${{ matrix.env.nais_vars_file }}.yaml"
